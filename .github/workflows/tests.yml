name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit & snapshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install


      # Runs every *.test.ts(x) under src/ via vitest.
      # Fails the build if any unit test or snapshot regresses
      # (vitest exits non-zero on snapshot mismatches by default in CI).
      - name: Run unit & snapshot tests
        run: bun run test:ci
        env:
          CI: "true"
